<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
      }
      #card {
        position: absolute;
        left: 0;
        top: 0;
        width: 30px;
        height: 30px;
      }
    </style>
  </head>
  <body>
    <div id="card"></div>
    <script>
      let x = 0;
      function move() {
        x += 2;
        document.getElementById("card").style.left = x + "px";
        requestAnimationFrame(move);
      }
      requestAnimationFrame(move);
    </script>
  </body>
</html>
